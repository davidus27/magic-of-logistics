<!-- Cargo unit body: large rectangle with two wheel circles. Specification 10.4.
     Body is 120x64 centred in a 132x96 canvas; the wheels straddle the long edges.
     Top-down wagon: rear axle, open bed for the wizard, front cabin. White for tint. -->
<svg xmlns="http://www.w3.org/2000/svg" width="132" height="96" viewBox="0 0 132 96">
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer hull, +X is forward -->
    <path d="M 8,20 L 108,16 L 126,28 L 126,68 L 108,80 L 8,76 Z"/>
    <!-- Cargo bed floor, open in the middle for the wizard -->
    <path d="M 16,28 L 90,26 L 90,70 L 16,68 Z"/>
    <!-- Cabin partition -->
    <path d="M 94,22 L 94,74"/>
    <!-- Side rails -->
    <path d="M 18,32 L 88,30"/>
    <path d="M 18,66 L 88,68"/>
    <!-- One crate at the rear, leaving the bed centre clear -->
    <path d="M 22,38 L 38,37 L 38,59 L 22,58 Z"/>
    <path d="M 22,48 L 38,48"/>
    <!-- Rear axle through the wheels -->
    <path d="M 40,18 L 40,78"/>
    <!-- Wheels with hubs -->
    <circle cx="40" cy="16" r="12"/>
    <circle cx="40" cy="16" r="3"/>
    <circle cx="40" cy="80" r="12"/>
    <circle cx="40" cy="80" r="3"/>
    <!-- Front tongue tip -->
    <path d="M 126,48 L 130,48"/>
  </g>
</svg>
